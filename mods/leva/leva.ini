; Leva 0.5.3. Keys: a letter, digit, F1-F24, Mouse3, Mouse4 or Mouse5, with Shift+, Ctrl+ or Alt+ in front for a
; combo (Shift+Q), or Shift, Ctrl or Alt alone. The game still sees the keys too, so pick ones it leaves alone.
key_suppress = Z
key_disrupt = X
key_ult = C
; aim_smooth: seconds her aim is averaged over for her lines and fields (her head sways; 0: the raw aim).
aim_smooth = 0.2
; arc_grenade 1: her arcs are the G-31 Arc grenade's detonation (arc_explosion) set off at each point; 0: arc_mode.
arc_grenade = 0
; arc_mode, how her arcs are made at each point: 1 a bullet fired down from 3 m that bursts like the GL-52
; De-Escalator's shell on whatever it hits (no bounce); 2 the arc_shell projectile itself fired down (222: the GL-52's
; shell, which can bounce away); 3 the GL-52 shell's burst set off directly; 0 arc_explosion set off directly (157: the
; G-31 Arc grenade's, whose electric effect stays on the field). steady: 1 never knocked down.
arc_mode = 1
arc_shell = 222
arc_explosion = 157
steady = 0
; native_rows 1: the lockdown bursts as an explosion and arc of her own (copies of the GL-52 burst's, added to the
; game's lists), so rs_damage sets its damage in the game's data; 0: the GL-52 burst, its damage cut as it lands.
; native_arc 1: its arc too (off: in testing the lightning then ran to and from her; the arc's hits are cut as they land).
native_rows = 1
native_arc = 0
; Too many arcs at once leave their lightning on the field for good: at most arc_rate arcs a second. Points with an
; enemy within arc_reach m come first (the rest of them wait their turn); with arc_empty = 1 the empty points get
; what the rate leaves over (showing her reach), else none (their charge, paralysis and Voltage still apply).
; arc_burst: extra arcs her ultimate and Blitz may use at once, above the rate.
; arc_shape 2: only arc row 15 takes the Arc Thrower's shape (its bang), row 6's fan keeps hitting; 1: both rows;
; 0: neither. arc_shape 1: her arcs take the ARC-3 Arc Thrower's shape (one beam jumping on from target to target) instead of
; the GL-52 burst's fan; arc_chain / arc_split (0 or more) then set its jumps and split, -1 keeps the shape's own.
; arc_range: how far an arc reaches, in m (0: the burst's own 10 m; the ARC-3's 55 m strands lightning on the field).
; While Leva is on, the GL-52 De-Escalator's own arcs do the same.
arc_rate = 10
arc_reach = 8
arc_empty = 1
arc_burst = 0
arc_shape = 0
arc_range = 0
arc_chain = -1
arc_split = -1
; Rational Suppression (a lockdown): cooldown; a field of rs_columns x rs_rows points over rs_width x rs_depth m,
; rs_distance m ahead, swept in across rs_sweep s per column (enemies under it paralysed rs_paralysis s), then arcs
; again every rs_pulse s for rs_seconds s, each pulse holding the enemies in it rs_hold s more; its arcs deal
; rs_damage of their damage (nothing else adds to it), at most rs_arcs arcs a pulse (enemies first).
rs_cooldown = 14
rs_distance = 12
rs_width = 18
rs_depth = 6
rs_columns = 7
rs_rows = 3
rs_paralysis = 4
rs_sweep = 0.05
rs_seconds = 10
rs_pulse = 0.5
rs_damage = 0.067
rs_hold = 1
rs_arcs = 2
; Orderly Disruption (Arc Rounds): cooldown; for od_seconds s her bullets set off an arc where they hit an enemy (one
; every od_step s at most), charging it; on charged enemies those arcs deal od_charged times.
od_cooldown = 15
od_seconds = 8
od_step = 0.2
od_charged = 1.3
; Quantum Calculation: cooldown, radius (four rings of arcs out to it), at most ult_arcs_max arcs on enemies.
; Superconduct Blitz: the window after it, the line's length and arc spacing (four arcs at its end, then back along
; it to her), Stealth after it, and its arcs' damage (times the Code it spends: 1 / 1.17 / 1.42 / 2).
ult_cooldown = 40
ult_radius = 20
ult_arcs_max = 24
blitz_window = 6
blitz_length = 20
blitz_step = 2.5
blitz_stealth = 4
blitz_power = 2
; The Fox's Scheme: Wise Support arcs on newly charged enemies within fs_radius m, at most fs_max per fs_every s, each
; fs_cut s off the ultimate's cooldown.
fs_radius = 20
fs_every = 4
fs_max = 2
fs_cut = 2
; Negative Charge: how long it lasts, her arcs' and her shots' damage on charged enemies.
nc_seconds = 6
nc_mult = 1.3
elite_mult = 1.15
; Positive Charge (on her): pc_heal health every pc_every s, her arcs on charged enemies pc_mult times again.
pc_heal = 10
pc_every = 4
pc_mult = 1.35
; Superconduct Code: most stacks, a stack every code_every s, code_per damage per stack, Superconduct Link at full.
code_max = 4
code_every = 4
code_per = 0.05
link_mult = 1.1
; Voltage zones: radius, how long they last, how long before they can burst.
vz_radius = 3.5
vz_seconds = 9
vz_arm = 1
; Her arcs find the ground from lp_climb m above her height down to lp_drop m below it.
lp_climb = 6
lp_drop = 12
; The T-Doll's body: hp_mult times a Helldiver's health, stamina_mult times her sprint before the bar empties.
hp_mult = 1.5
stamina_mult = 2
