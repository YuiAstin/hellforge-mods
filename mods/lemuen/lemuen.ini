; Lemuen 0.1.9. Keys: a letter, digit, F1-F24, Mouse3, Mouse4 or Mouse5, with Shift+, Ctrl+ or Alt+ in front for a
; combo (Shift+Q). The game still sees the keys too (Shift sprints, R reloads), so pick ones it leaves alone.
key_s1 = Z
key_s2 = X
key_s3 = C
; Persecution: an enemy with armour mark_armour+ or mark_health+ health she keeps within mark_cone degrees of her
; view (mark_range m) for mark_seconds is marked for mark_last s (0: until replaced or killed); marked enemies
; take mark_mult times the damage from her. At most mark_max are marked at once: a new mark replaces the oldest.
mark_range = 600
mark_cone = 20
mark_seconds = 6
mark_last = 0
mark_mult = 1.18
mark_armour = 3
mark_health = 750
mark_max = 5
; In first person, the enemy under her crosshair (within mark_aim degrees, any enemy she can see) is marked at once.
; A mark that gave way to a newer one is not marked again by watching for mark_rewatch s (aiming at it still does).
mark_aim = 2.5
mark_rewatch = 30
; Modus Extraditio: modus_after s after she lands, her shots deal modus_mult times their damage.
modus_after = 20
modus_mult = 1.1
; Salve Etiam: cooldown; with a sniper or marksman rifle in hand (any gun: s1_any_gun 1) her shots deal s1_mult
; times their damage until she reloads.
s1_cooldown = 15
s1_mult = 3.1
s1_any_gun = 0
; Honesta Missio: cooldown; until she reloads, the enemy in the middle of her scope (first person: the first thing
; a ray from the middle of her view meets, within s2_range m; s2_cone degrees only without the raycast) builds up:
; her next shot on it deals s2_min rising to s2_max times its damage over s2_hold s. first_person: the camera this
; close to her head (m) counts as scoped.
s2_cooldown = 20
s2_min = 1.8
s2_max = 4.25
s2_hold = 3.5
s2_cone = 4
s2_range = 600
first_person = 0.45
; Memento Mori: cooldown; an Orbital 120mm HE Barrage shell (s3_shell, 194) falls from s3_height m on every enemy
; she has marked, s3_every s apart, at most s3_max.
s3_cooldown = 90
s3_every = 0.35
s3_height = 120
s3_max = 8
s3_shell = 194
; Her body: hp_mult times a Helldiver's health, stamina_mult times her sprint. hellbomb_on_exhaustion 1 sets off a
; Hellbomb on her if she runs her stamina dry (a T-Doll's price; off for her).
hp_mult = 1.1
stamina_mult = 1
hellbomb_on_exhaustion = 0
; Damage numbers (the HUD): shown for a hit her on-hit multipliers (mark, Honesta Missio) raised numbers_at times or
; more, as Arknights' red numbers (Modus and Salve Etiam are ATK buffs, the shells her ATK: no number). 0: every hit.
numbers_at = 1.5
; Line of sight: 1, marks and Honesta Missio's lock only on enemies she can see (no walls or terrain between);
; 0 through walls (0.1.5's way).
line_of_sight = 1
