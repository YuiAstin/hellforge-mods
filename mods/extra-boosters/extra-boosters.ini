; Extra Boosters settings (read at game start; edit them with the game closed).
; Every player in a co-op session needs this mod with the same settings.
enabled = 1
; The new booster is a copy of this vanilla booster's row (its tuning value and picker data):
; 1 Vitality, 2 Stamina, 3 Muscle Enhancement ... 20 Surplus EAT Allocation. A new booster has no vanilla effect of
; its own; another mod gives it one (Primed Sure Footed does for this one).
base = 3
; Its icon: another vanilla booster's (same numbers as base); 0 keeps the base's.
icon_from = 0
; Its item id, as hex. Change it only if it clashes with another mod's (and set the same booster_id in Primed Sure Footed).
id = 0x1041BB56
; Its tuning value (row +0x08); empty keeps the base's.
value =
; Its enum name, where the game prints booster names (letters, digits, _).
name = PrimedSureFooted
; Its name and description in the booster picker and the loadout. Leave both empty to keep the base's text.
title = Primed Sure Footed
description = Helldivers are never knocked down or ragdolled. Hits still make them flinch and push them back. (Needs the Primed Sure Footed mod.)
