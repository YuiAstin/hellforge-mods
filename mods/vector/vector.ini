s3_every = 0.3
accelerant_seconds = 15
accelerant_mult = 1.3
s3_refund = 1
; Perception Block: fire_immune 1, fire does nothing to her: the statuses fire_status_1..4 (5 fire, 6 fire panic,
; 32 heavy burning, 67 the flamer's slow) never land on her and fire's damage is cancelled. fire_element: the damage
; element of fire (-1: learned from the first burning thing she sees; the log names it).
fire_immune = 1
fire_status_1 = 5
fire_status_2 = 6
fire_status_3 = 32
fire_status_4 = 67
fire_element = -1
; fire_pour: an enemy her fire did not burn within 2 s gets fire build-up every frame for up to this many seconds
; (0: never). A kind this lit is poured on from the start for the rest of the session.
fire_pour = 0
; Her own burn (own_burn 1): what takes no fire damage from the game's fire (tanks, walkers, gunships) burns by her
; hand instead, past its armour: own_burn_percent of its full health (never less than own_burn_damage) every
; own_burn_every s for own_burn_seconds after her fire. At 1 percent four times a second a full-health enemy burns
; through in 25 s of unbroken burning. Smolder, Overburn and Accelerant multiply it.
own_burn = 1
own_burn_damage = 12
own_burn_percent = 1
own_burn_every = 0.25
own_burn_seconds = 8
; s2_blast: the explosion set on Portent of Doom's target as it is cast (359: an Eagle Napalm bomb's; 63: an Orbital
; Napalm shell's; 224: an incendiary grenade's; 0: none).
s2_blast = 359
; options_key: the key that opens her options screen over the game, as a Windows virtual-key number (120: F9,
; 121: F10, 118: F7; 0: no screen). The screen needs a HellForge with screens over the game (SDK 17); without one
; her numbers are on the MODS tab (Mod Options Menu).
options_key = 120
