s2_cooldown = 15
s2_cone = 10
s2_range = 150
s2_buildup = 300
smolder_seconds = 12
smolder_mult = 1.5
; Searing Finale: cooldown; where she aims (the enemy under her crosshair, else where her aim lands, s3_range m)
; s3_shells napalm shells (projectile s3_shell, 234: the Orbital Napalm Barrage's; 141: the Eagle Napalm Airstrike's)
; fall from s3_height m, s3_every s apart and up to s3_spread m apart. Accelerant for accelerant_seconds: fire
; damage on enemies is accelerant_mult times. s3_refund 1: her other two skills are ready again (Extra Command).
