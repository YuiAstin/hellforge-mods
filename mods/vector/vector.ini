; Vector 0.2.4. Keys: a letter, digit, F1-F24, Mouse3, Mouse4 or Mouse5, with Shift+, Ctrl+ or Alt+ in front for a
; combo (Shift+Q). The game still sees the keys too (Shift sprints, R reloads), so pick ones it leaves alone.
key_s1 = Z
key_s2 = X
key_s3 = C
; Confectance Index: each skill she uses gives conf_cast points (at most conf_max). At conf_max they are spent: her
; hits deal conf_mult times for conf_seconds.
conf_max = 6
conf_cast = 2
conf_mult = 1.25
conf_seconds = 12
; Fire: she sets an enemy on fire with the status fire_status (5: fire), fire_buildup of build-up a time (100: as a
; full hit). An enemy counts as burning for burn_seconds after a fire status or a tick of fire on it.
fire_status = 5
fire_buildup = 100
burn_seconds = 5
; Dead End Meltdown: cooldown; for s1_seconds her shots set what they hit on fire. A shot on an enemy already
; burning sets off a fire burst on it (explosion s1_burst, 26: the EAT-700's fire shrapnel; 69: the G-13 Incendiary
; Impact's; 409: the G-142 Pyrotech's; 0: none), at most one an enemy every s1_burst_every s and burst_rate a second
; in all, and Overburns it for overburn_seconds: fire damage on it is overburn_mult times.
s1_cooldown = 20
s1_seconds = 10
s1_burst = 26
s1_burst_every = 2
burst_rate = 4
overburn_seconds = 8
overburn_mult = 1.3
; Portent of Doom: cooldown; the enemy under her crosshair (s2_cone degrees, s2_range m, in sight) is set on fire
