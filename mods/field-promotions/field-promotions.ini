; Veterancy System 0.19.0 settings, read at game start. Edit them with the game closed: HellForge holds the mod
; folder read-only while it runs. A setting left out keeps its default.

; Mortar kills this mission for level 2 and level 3.
level2_kills = 30
level3_kills = 125
; 0: earn levels; 1, 2 or 3: always this level (for testing).
force_level = 0
; Level 2: the EMS opener (1 on, 0 off) and its speed (times the EMS shell's).
ems_opener = 1
ems_speed = 2
; Level 2: the 4th shell: 2 the sentry fires it (a 4-round salvo, from its next call-in), 1 dropped in by the mod, 0 off; and the dropped one's delay.
extra_round = 1
extra_delay = 0.6
; Metres above the aim point the bonus rounds start from.
drop_height = 40
; Level 3: the pattern's half size (metres from the centre to a side) and the seconds between corners and edges.
pattern_half = 8
pattern_step = 1
; Level 3: the sentry's fire rate, times its own (1: unchanged, the default; below 1 slows its salvos, but a sentry called in
; that way fires a late shell into its own barrel and destroys itself).
l3_fire_rate = 1
; No bonus shell (EMS opener, dropped 4th round, pattern) falls within this many metres of one of your
; sentries, and a shell going off there is not taken as the salvo's impact (0: off).
safe_radius = 12

; The gas doctrine: kills by every gas armament together, for its level 2 and level 3.
gas_level2_kills = 30
gas_level3_kills = 150
; Gas doctrine level 2: the gas stratagems' cooldowns, times their own.
gas_cooldown_mult = 0.5
; Gas doctrine level 3: confused enemies take and deal more damage. Confusion lasts this long after the last gas hit.
gas_taken_mult = 1.25
gas_dealt_mult = 1.5
confusion_seconds = 8
; 1: confused enemies also deal more to Helldivers; 0: only to other enemies.
gas_dealt_vs_players = 0
; The gas damage element: -1 learns it from the first gas armament hit.
gas_element = -1
; Extra enemies gas never confuses (no level 3 boost), as hex resources split by commas. Built in: Bile Titans, Factory and
; War Striders, tanks, Harvesters. The log lists each mission's gassed enemy types with their resources at its end.
gas_immune = 

; Gas Mortar Sentry (and each other gas armament): its own kills this mission for level 2 and level 3 (gas
; kills are slower than the Mortar Sentry's).
gm_level2_kills = 30
gm_level3_kills = 80
; Gas Mortar Sentry level 2: 1 it takes no damage while it stands in gas; its magazine gains a round per this many
; seconds of its lifetime (0: off).
gm_shield_in_gas = 1
gm_ammo_seconds = 2
; How big (metres) and how long (seconds) a gas cloud is taken to be after a gas shell, strike, mine or grenade.
gas_cloud_radius = 7
gas_cloud_seconds = 10
; Gas Mortar Sentry level 3: an enemy in its gas gains a stack every gm_stack_seconds (up to gm_stack_cap; one lost
; every gm_stack_decay s out of it). Its next shell landing on them pops the stacks: one explosion of gm_pop_damage per stack, of
; gm_pop_radius + gm_pop_radius_step per stack metres (gm_pop_explosion: the ExplosionSettings row it borrows).
gm_stack_seconds = 0.7
gm_stack_cap = 10
gm_pop_damage = 60
gm_pop_radius = 2
gm_pop_radius_step = 0.6
gm_pop_explosion = 120
; Gas Mortar level 3: a shell's detonation runs through every Gas Mortar cloud touching its own; seconds between
; its pops (each stacked enemy pops where it stands).
gm_pop_step = 0.12
; Gas Mortar level 3: out of its gas, an enemy loses one stack every this many seconds.
gm_stack_decay = 3

; Gatling Sentry: its kills this mission for level 2 and level 3.
gat_level2_kills = 30
gat_level3_kills = 180
; Level 2: whole-deployment ammo; focus fire: extra damage per hit on the same target (0.04: +4%), and its most.
gat_ramp_per_hit = 0.04
gat_ramp_max = 1
; Level 3: its round's armour penetration (4: heavy); its high-explosive blast, an ExplosionSettings row (266: the Orbital
; Gatling Barrage's shell, 350 damage, AP 3) and that blast's damage (0: the row's own; above 0 changes the row for
; everything using it). Read at game start.
gat_ap = 4
gat_he_damage = 0
gat_he_explosion = 266
; Gatling level 3: one round in this many is high-explosive (1: all; its belt is 4 rounds, so 4: one in four,
; 2: every other). The rest are AP-only. Its fire rate at level 3, rounds a minute (0: the game's 1600; the A-10's
; GAU-8 fires about 3900).
gat_he_every = 4
gat_l3_rpm = 0
; Gatling Sentry level 3: 1: its own high-explosive blasts (any Gatling Sentry's) do not hurt Gatling Sentries;
; 0: they do.
gat_self_immune = 1

; Machine Gun Sentry: its kills this mission for level 2 and level 3.
mg_level2_kills = 30
mg_level3_kills = 180
; Level 2: damage it takes, times (0.5: half); 1: Helldivers' hits (grenades, strikes, stray fire) do nothing to it.
mg_damage_taken = 0.5
mg_friendly_immune = 1
; Level 3: its shield stops this many hits, whatever they deal (a Charger's ram too), and gets one back every
; mg_shield_recharge seconds once mg_shield_delay seconds pass without a hit. Hits under mg_shield_min_hit damage
; pass the shield (halved as at level 2) and do not use it (0: every hit uses it).
mg_shield_hits = 40
mg_shield_recharge = 1.5
mg_shield_delay = 4
mg_shield_min_hit = 0
; Level 3: its lifetime, times its own (from its next call-in).
mg_lifetime_mult = 1.5

; Laser Sentry: its kills this mission for level 2 and level 3.
ls_level2_kills = 30
ls_level3_kills = 180
; Its focus: seconds of beam to reach full; a pause longer than ls_ramp_grace s lets it fall, ls_ramp_decay
; times as fast as it builds.
ls_ramp_seconds = 5
ls_ramp_grace = 0.6
ls_ramp_decay = 2
; Level 2 at full focus: damage times this, armour penetration (4: heavy, 5: tank, 6: anti-tank) and demolition.
ls_l2_damage = 2
ls_l2_ap = 5
ls_l2_demolition = 40
; Level 3 at full focus: the same, and the beam's stagger and push (the game's: 0).
ls_l3_damage = 3
ls_l3_ap = 6
ls_l3_demolition = 60
ls_l3_stagger = 30
ls_l3_push = 30
; The beam's damage row (507: the Laser Sentry's own).
ls_damage_id = 507
; Level 2 and 3, heat sink (from its next call-in): its beam's heat and its cooling, times the game's.
ls_heat_mult = 0.5
ls_cool_mult = 3

; M-1000 Maxigun: its kills this mission for level 2 (Veteran) and level 3 (Elite).
mx_level2_kills = 60
mx_level3_kills = 200
; A level reaches the next Maxigun called in (its backpack's size reaches the one worn too). 1: each level earned
; makes its call-in ready at once, so a fresh one can be called; 0: off.
mx_refund = 1
; Its fire rates, rounds a minute, chosen in its weapon menu: level 2 offers low and mid (mid as it arrives),
; level 3 all three.
mx_rate_low = 2000
mx_rate_mid = 4500
mx_rate_high = 6000
; Level 2: spin-up and spin-down seconds (the game's: 0.5 and 0.5), recoil times the game's, and 1: it fires on
; the move (0: the game's stand-still).
mx_spin_up = 0.2
mx_spin_down = 1.5
mx_recoil = 0.6
mx_walk_while_firing = 1
; Its backpack's rounds at level 2 and level 3 (the game's: 1000; at most 16383); a supply box refills half.
mx_l2_pack = 3000
mx_l3_pack = 6000
; Level 3, Old Painless: after this many seconds of continuous fire its rounds pierce at this armour penetration
; (the game's: 3; 4: heavy) until it stops firing.
mx_ap_seconds = 2
mx_ap = 4

; A/MLS-4X Rocket Sentry: its kills this mission for level 2 (Veteran) and level 3 (Elite).
rs_level2_kills = 30
rs_level3_kills = 150
; Level 2: 1 its rocket carries the P-33 Missile Pistol's warhead (1000 direct, AP 5; a 300 blast, radius 2 / 4 / 12 m;
; the rocket's own: 525, a 150 blast, 1 / 4 / 6 m); 0 off. Its magazine at level 2 and level 3 (the game's: 16).
; Both reach a Rocket Sentry called in after the level.
rs_warhead = 1
rs_l2_mag = 32
rs_l3_mag = 48
; Level 3, Last Stand: 1 when your Rocket Sentry is destroyed or its time runs out, the rockets it has left drop
; on the enemies within rs_last_stand_radius m, shared evenly (10 left and 5 enemies: 2 each), from
; rs_last_stand_height m straight above each; with none near, they go out in a ring around it. Then this
; explosion row goes off where it stood (154: the P-33's). 0: off.
rs_last_stand = 1
rs_last_stand_radius = 50
rs_last_stand_height = 100
rs_last_stand_blast = 154

; 1: a banner on screen for each level earned in a mission; 0: off. Also on the MODS tab (Mod Options Menu).
hud_toasts = 1
; Seconds a banner stays on screen (the Maxigun's: 2 more, for its call-in box). Also on the MODS tab.
hud_toast_seconds = 5
; 1: a rank badge (one chevron: level 2, two: level 3) on each promoted stratagem in the mission's stratagem
; list; 0: off. Both need the Veterancy System HUD addon, HD2Runtime and Bingus Shared Loader.
hud_badges = 1
