; Time Stop Probe 0.3.2 (a probe, not a release). key: a letter, digit, F1-F24, Mouse3-5, with Shift+, Ctrl+ or Alt+.
; Each press stops the enemies within range m for seconds s, with the next method: 1 stun only, 2 stun and the
; animation state machine off (the pose freeze), 3 the state machine off alone. method: 0 takes them in turn,
; 1-3 always that one.
key = F7
range = 50
seconds = 5
method = 0
; hold: in methods 2 and 3, 1 also holds each enemy where it stood (0: as 0.1.0, they slide).
hold = 1
; hold_high: 1 holds those with an entity id of 0x400000 or more too (0: as 0.3.0, they slide).
hold_high = 1
; hold_idle: 1 holds those whose navigation record is inactive too (a stunned enemy's; 0: as 0.3.1).
hold_idle = 1
; rare_max: when a unit cannot be found by its id, the HUD mod looks for it by its place among unit types with at
; most this many units in the world (reading the place of a unit of a mass-instanced type has crashed the game).
rare_max = 4
