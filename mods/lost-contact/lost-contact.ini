; Lost Contact 0.4.1. Modes: 1 on, 2 observe (counts in the log only, touches nothing), 0 off. The keys (in a
; mission) cycle on -> observe -> off: a letter, digit or F1-F24, with Ctrl+, Shift+ or Alt+ in front.
; A character kit can limit them while it is the active kit: with Lemuen, patrols only. kit_rules 0 keeps both as set
; here. All of them are also on the MODS tab (ESC > OPTIONS > MODS > Lost Contact), with what runs now and why: with
; the Vanilla Plus Megapack's Mod Options Menu, which needs HD2Runtime and Bingus Shared Loader (the mod's own data
; registers the rows), or with giblett's Vanilla Plus Megapack build (HD2_MOD_OPTIONS_v1). Without either, this file
; and the keys are the settings. The tab's choices are saved in %LOCALAPPDATA%\HellForgeMods\lost-contact.ini and read
; after this file (delete it to go back to this file).
kit_rules = 1
;
; Break contact: an enemy after you that, with its squad, has not sensed you for lose_after seconds (within
; break_range m of you) loses you and goes to search where it last saw you. Sight brings it back as usual.
break_mode = 1
lose_after = 3
break_range = 80
key_break = Ctrl+F9
;
; Patrols as they set out: the game's roaming patrols set out 100 to 120 m from you, aimed at a spot near you. When
; their straight line would pass within pass_by m of you, they are aimed to pass you at pass_by m instead (on the
; side they leaned to, and 40 m on), so they walk by rather than onto you; the same when the game aims them at you
; again later. Under 20 (or 0): off. Part of the patrols mode below (on / observe / off). Terrain and a patrol's
; spread can still bring single enemies closer, and one that sees or hears you hunts you as usual.
pass_by = 50
;
; Patrols: a patrol (no target, walking) sent to within seek_radius m of you is sent to an outpost at least
; keep_away m from you instead (outposts: where enemies stand at ease), then the next, again every resend seconds.
; Enemies within patrol_range m of you are looked at. Once one has a target or senses you, it is left alone: a
; patrol that finds you fights you as usual.
patrol_mode = 1
seek_radius = 50
keep_away = 100
patrol_range = 300
resend = 3
key_patrol = Ctrl+F10
