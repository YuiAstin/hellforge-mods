; Lost Contact 0.2.0. Modes: 1 on, 2 observe (counts in the log only, touches nothing), 0 off. The keys (in a
; mission) cycle on -> observe -> off: a letter, digit or F1-F24, with Ctrl+, Shift+ or Alt+ in front.
; A character kit can limit them while it is the active kit: with Lemuen, patrols only. kit_rules 0 keeps both as set
; here. All three are also on the escape menu's MODS tab (Vanilla Plus Megapack), with what runs now and why; the tab's
; choices are saved beside the game's settings and read after this file.
kit_rules = 1
;
; Break contact: an enemy after you that, with its squad, has not sensed you for lose_after seconds (within
; break_range m of you) loses you and goes to search where it last saw you. Sight brings it back as usual.
break_mode = 1
lose_after = 3
break_range = 80
key_break = Ctrl+F9
;
; Patrols: a patrol (no target, walking) sent to within seek_radius m of you is sent to an outpost at least
; keep_away m from you instead (outposts: where enemies stand at ease), then the next, again every resend seconds.
; Enemies within patrol_range m of you are looked at. Once one has a target or senses you, it is left alone: a
; patrol that finds you fights you as usual.
patrol_mode = 1
seek_radius = 50
keep_away = 100
patrol_range = 300
resend = 3
key_patrol = Ctrl+F10
