; Koleda 0.1.15. Keys: a letter, digit, F1-F24, Mouse3, Mouse4 or Mouse5, with Shift+, Ctrl+ or Alt+ in front for a
; combo (Shift+Q). The game still sees the keys too (Shift sprints, R reloads), so pick ones it leaves alone.
key_s1 = Z
key_s2 = X
key_s3 = C
; Upshift: at most upshift_max stacks, each +upshift_damage (0.06: 6%) of her damage; one is lost every
; upshift_decay s without a gain. A Sinner action (a volley, its pull) gives one (two in S+), at most one gain
; every upshift_every s.
upshift_max = 5
upshift_decay = 10
upshift_damage = 0.06
upshift_every = 3
; The Sinner (sinner 0: none). call_mode 1: Hallucination puts one Sinner call in her stratagem list (code RRLLD)
; each time; 0: one call granted at the drop, unlimited, with the stratagem's own cooldown (s3_cooldown).
; share_pct of each hit on her goes to the Sinner instead (never below 1 from that), while it stands within
; share_range m.
sinner = 1
call_mode = 1
share_pct = 50
share_range = 60
; The leash: it walks to her beyond leash_start m and stops within leash_stop (in N gear: within guard_start);
; beyond leash_warp m it is warped beside her (the last resort). Stuck (walking, but under 0.5 m/s for
; stuck_seconds) it is pushed through: stepped push_step m along its way, put on the ground each time, until it
; moves again (at most push_steps steps; 0: never). Without the game's locomotion it slides
; at slide_speed m/s. In S+ it stands plus_distance m short of her target, at most plus_leash m from her.
; warp_needs_walks 1: it is moved only if it has a navigation record (the warp setter crashed on entities
; without one); 0 skips that check (at the risk of that crash).
leash_start = 4
leash_stop = 2
guard_start = 4
leash_warp = 40
stuck_seconds = 1.5
push_step = 1.5
push_steps = 10
slide_speed = 6
; nav_path 1: with a navigation record of its own, it is sent to its follow point on the navmesh (the game's
; set_destination, as Lost Contact's patrols) and heads for the path's next waypoint instead of straight at it.
plus_distance = 8
plus_leash = 25
warp_needs_walks = 1
nav_path = 1
; Its fire (sinner_fire 0: none): rounds of hers from its shoulders, one every gun_every s (S+: times plus_rate);
; gun_every 0: at the fire rate of the gun each gear's round comes from, with its pellets (0.1.2).
; N: whoever last hit her, else the nearest enemy within guard_range m of her; S: the nearest within fire_range m
; of it; S+: her target. Its own arms' rounds (projectile types, copied), at the Patriot's arms' fire rates: the
; right arm's minigun by gear, round_n / round_s / round_plus (148: the Patriot's minigun), and in S+ the left arm's
; rockets too, round_rocket (128: the Patriot's rockets; 0: none). One that cannot be spawned falls back to
; round_fallback (7: the Guard Dog's). sinner_sight 1: only at what it can see.
sinner_fire = 1
sinner_sight = 1
round_n = 148
round_s = 148
round_plus = 148
round_rocket = 128
round_fallback = 7
gun_every = 0
plus_rate = 0.6
guard_range = 20
fire_range = 40
; KANSEI DORIFTO (pull_on 1; untested, so off): in S+, every pull_every s, enemies within pull_radius m of the
; Sinner are dragged to it, and pull_explosion (0: none) goes off on it.
pull_on = 0
pull_every = 12
pull_radius = 8
pull_explosion = 0
; Eye of the Snow Wolf: cooldown; the enemy under her crosshair (s1_cone degrees, s1_range m, in sight) takes
; s1_rounds heavy rounds (s1_round, 226: the APW-1's), s1_every s apart.
s1_cooldown = 12
s1_rounds = 2
s1_every = 0.15
s1_cone = 10
s1_range = 200
s1_round = 226
; Tactical Playbook: cooldown; Kinetic Recovery for kr_seconds: her damage and the Sinner's fire x kr_mult, she
; heals kr_heal, the Sinner kr_sinner_heal of its health.
s2_cooldown = 20
kr_seconds = 10
kr_mult = 1.2
kr_heal = 25
kr_sinner_heal = 0.1
; Hallucination: cooldown. Winner!: cleanse 1 removes the Sinner's fire, gas, stun and slow once the game's status
; functions are pinned (off until then); 2 calls them unpinned; 0 never.
s3_cooldown = 90
cleanse = 1
; Driving with the game's own locomotion (the probe's numbers; -1 unknown: the Sinner slides instead).
; drive_test 1 writes the stick without the engine and mover calls.
; turn 1: it turns toward what it fires at, else the way it slides (its turn record, 0.1.4).
; round_speed: m/s of its minigun rounds (her copies; 0: the Patriot's own): slower, its tracers start at its arm.
; max_rounds: the most projectiles it spawns a second, in all (spawned rounds by the thousand crashed the renderer).
; follow_distance: m it keeps from her (beside and behind); personal_space: closer than this it steps away.
follow_distance = 10
personal_space = 6
max_rounds = 20
round_speed = 250
turn = 0
drive = 1
drive_test = 0
loco_manager = -1
loco_map = -1
loco_records = -1
loco_stride = 164
stick_offset_fwd = -1
stick_offset_side = -1
stick_offset_turn = -1
; Aiming: line_of_sight 1, Eye of the Snow Wolf's target must be in sight. first_person: the camera this close to
; her head (m) counts as first person.
line_of_sight = 1
first_person = 0.45
