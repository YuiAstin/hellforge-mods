; Maxigun Test settings, read at game start. Edit them with the game closed.
; 0: only log the vanilla values; 1: apply the test values below.
apply = 1
; Seconds into each mission before the test values go on (they come off at its end); -1: at game load.
; Call in a Maxigun before then and hold it, to see whether a gun already out takes them.
apply_delay = 60
; 1: when the test values go on, the Maxigun's call-in cooldown is refunded (ready at once); 0: off.
refund_on_apply = 1
; Fire rate slots 1, 2 (the default, what it fires when called in) and 3, rounds a minute (0: leave the game's). The editor
; lists slots 1 and 3 up to 3000: 6000 tests what the game really does above that.
rate_1 = 2000
rate_2 = 4500
rate_3 = 6000
; Spin-up and spin-down, seconds (-1: leave the game's).
wind_up = 0.2
wind_down = 1.5
; 0: walk while firing; 1: the game's stand-still; -1: leave it.
stationary_while_firing = 0
; Recoil, times the game's (all four inputs; 1: unchanged).
recoil_mult = 0.6
; Backpack: capacity, starting rounds and rounds from a supply box (0: leave the game's). The game sends the pack's count
; in 10 bits (up to 1023); pack_bits widens that (14: up to 16383, as HellForge's machine-gun-10k example; 10: off).
pack_capacity = 6000
pack_start = 6000
pack_refill = 3000
pack_bits = 14
; 1: give the Maxigun the MG-43's fire modes and weapon functions (its rate choice in the weapon menu); 0: off.
copy_mg43_rate_menu = 1
