; Executor 0.2.4 (TEST BUILD: untested in game). Keys: a letter, digit, F1-F24, Mouse3, Mouse4 or Mouse5, with
; Shift+, Ctrl+ or Alt+ in front for a combo (Shift+Q). The game still sees the keys too, so pick ones it leaves alone.
key_s1 = Z
key_s2 = X
key_s3 = C
; His trait: every enemy one of his shots hits heals him heal_pct % of his maximum health, up to heal_cap enemies
; a shot (hits within shot_gap s of the shot's first are that shot's). heal_limbs 1: each heal also mends every
; injured limb in full. heal_shotguns_only 1: only a gun firing several pellets a shot heals.
heal_pct = 50
heal_cap = 3
shot_gap = 0.12
heal_limbs = 1
heal_shotguns_only = 0
; Stims heal him as anyone (stim_undo 0, the default since 0.1.1). stim_undo 1 (experimental) took back any heal
; not his own, but the stim's effect still showed and his own heals could be taken back too.
stim_undo = 0
; The Chosen One: each shot has chosen_pct % to fire a free extra round chosen_delay s later, plus chosen_step %
; for each round spent while a skill runs; its pellets spread chosen_spread degrees. A gun whose round cannot be
; spawned fires projectile free_round_fallback instead. At most max_rounds spawned rounds a second. A gun with no
; ProjectileWeapon (the DBS-2 Double Freedom loads shells) fires its shells' own projectile, else
; no_projectile_round (179: SG-225 Breaker buckshot; 0: such guns fire no spawned rounds).
chosen_pct = 20
chosen_step = 5
chosen_delay = 0.08
chosen_spread = 3
free_round_fallback = 7
max_rounds = 30
no_projectile_round = 179
; Empathy by Shotgun: empathy 1, +1 round to each skill for every other Laterano kit installed (Exusiai, Lemuen,
; Exusiai the New Covenant).
empathy = 1
; Damage numbers (his HUD, as Lemuen's): a number over each hit his skills raised to numbers_at times its damage or
; more (1.5: Testament Exacted, Close Combat, Damnatus Ex Foedere and its blasts); 0: every hit of his.
numbers_at = 1.5
; Area rounds: area_rounds 1, each of his shots also fires one round of his gun (at most area_pellets of its pellets;
; 0: all) at each living enemy
; in a square in front of him: area_size m along his aim by area_size m across it, from where he stands
; (area_size_s3 while Damnatus Ex Foedere runs); at most area_max enemies a shot, the nearest first, each in his
; line of fire. They heal as his shot's hits (the same heal_cap), spend no skill round, roll no Chosen One, and
; are not held back by max_rounds.
area_rounds = 1
area_size = 15
area_size_s3 = 25
area_max = 12
area_pellets = 3
; Skills run for their rounds (his shots), one at a time; the cooldown starts when one ends.
; Testament Exacted: s1_rounds shots deal s1_mult times their damage and pierce s1_ap more armour.
s1_cooldown = 20
s1_rounds = 8
s1_mult = 1.5
s1_ap = 2
