; W 0.7.5 (her three skills and her passives; not released yet). The options screen (F9) changes these in game; this file holds the defaults.
; Keys: a letter, digit, F1-F24, Mouse3-5, with Shift+, Ctrl+ or Alt+.
key_s1 = Z
key_s2 = X
key_s3 = C
key_s4 = B
; King of Hearts: the rounds the launcher is handed with, the multiple of its damage, and the cooldown from when it is
; put away (s)
koh_rounds = 40
koh_damage = 3.5
koh_cooldown = 16
; the freeze: how long (s), and how far from a round's blast (m)
koh_freeze_seconds = 3
koh_freeze_radius = 5
; Jack in the Box: jib_charges mines held ready, one back every jib_charge_every s; a press lays one under the enemy
; nearest her aim line in a box jib_width m across and jib_length m ahead (a random spot in it if there is none). At
; most jib_max lie at once (the oldest goes). An enemy within jib_trigger m sets one off after jib_delay s: the game's
; explosion jib_explosion (366: the MD-6 mine's), its damage jib_damage times, enemies within jib_freeze_radius m held
; jib_freeze s. A mine lasts jib_seconds. jib_marker: what shows where it lies (0 none, 1 a G/40-K Melta Mine, 2 a TM-1
; Lure Mine, 3 the game's contact mine), besides the HUD's marker: still being tried.
jib_charges = 5
jib_charge_every = 8
jib_max = 30
jib_width = 15
jib_length = 40
jib_trigger = 3
jib_delay = 1.5
jib_seconds = 120
jib_damage = 2.8
jib_freeze = 2.2
jib_freeze_radius = 5
jib_explosion = 366
jib_marker = 0
; jib_model 1: her mines wear the MD-6's mine (the look only); the kit loads the minefield's package for it
jib_model = 1
; D12: key_s3 marks what is nearest her aim line within d12_range m and d12_aim m of the line (an enemy before a
; structure or prop; d12_things 0: enemies only), up to d12_marks; a mark lasts d12_seconds. key_s4 blows them: the
; game's explosion d12_explosion (80: the TED-63 Dynamite's), its damage d12_damage times, enemies within
; d12_freeze_radius m held d12_freeze s. She can mark again d12_cooldown s after the detonation.
d12_marks = 4
d12_range = 80
d12_aim = 2.5
d12_seconds = 90
d12_cooldown = 20
d12_damage = 3.1
d12_freeze = 5
d12_freeze_radius = 6
d12_explosion = 80
d12_things = 1
; Artilleryman: splash 1 sets off a small blast (splash_explosion, the game's explosion type) where a shot of hers lands
; on an enemy (257: the G-6 Frag's), at most one every splash_every s. Insult to Injury: an enemy her skills hold takes insult_mult times
; her damage.
splash = 1
splash_explosion = 257
splash_every = 0.4
; splash_safe: no burst within this many metres of her
splash_safe = 8
insult_mult = 1.18
; Ambush: 0 off, 1 on ambush_after s after she lands, 2 on after ambush_after s without firing. While on, ambush_miss of
; the hits on her miss and the range enemies see her at is cut by ambush_visual_cut percent (as Ascalon is hidden);
; ambush_forget 1: enemies within ambush_range m that do not sense her forget her as well.
ambush = 2
ambush_after = 10
ambush_miss = 0.6
ambush_visual_cut = 60
ambush_forget = 0
ambush_range = 80
; mine_probe 1: after a minefield's deployer lands, the units the game spawns and the minefield manager's fields are
; logged (research for Jack in the Box's mines).
mine_probe = 1
; rare_max: when a unit cannot be found by its id, the HUD mod looks for it by its place among unit types with at most
; this many units in the world (reading the place of a unit of a mass-instanced type has crashed the game).
rare_max = 4
; options_key: the virtual key that opens the options screen (120: F9; 0: none)
options_key = 120
