; Commando Plus 0.4.0 (TEST BUILD). Commando missions made a little more forgiving. Host or solo: a
; joined player's game changes nothing. Commando is told by the Super Destroyer call-in (Call In Destroyer) on your
; stratagem record, read 8 s after the mission starts.
;
; 1 = the mission timer is paused in Commando; 0 = it runs as usual.
no_timer = 1
;
; Free Resupply calls granted outside your loadout at the drop-in (0 to 2).
resupply_calls = 1
;
; Extra uses of the Super Destroyer call-in (0 to 3; Commando gives 1).
extra_calls = 1
;
; 1 = the options above apply to every mission, not only Commando; 0 = Commando only.
every_mission = 0
;
; More stims and grenades at points of interest: NOT WORKING YET (1 = off). The loot roll it changes fills the POI
; crates (support weapons, credits), not stims or grenades; where those come from needs a probe first.
poi_extra = 1
;
; Outpost caches: every enemy base you clear (its bug holes, fabricators or Illuminate spawners within base_radius m of
; each other, all closed or destroyed) gives free resupply calls to throw into it. 0 = off.
outpost_caches = 1
; Calls for a small base, and for a large one (3 or more spawners, or a big nest / bulk or gunship fabricator / bunker).
cache_calls_small = 1
cache_calls_large = 2
; 0 = the game's reward ammo rack (falls back to Resupply if it cannot be granted); 1 = uses of Resupply.
cache_reward = 0
; How close spawners stand to count as one base (m, 10 to 200).
base_radius = 40
; TEST: the reward ammo rack can be thrown any time, not only while the Super Destroyer is overhead (1 on, 0 off).
racks_anytime = 1
;
; TEST: a Resupply waiting at the Reinforcement Pods from the mission's start: 1 one, carried by the Respawn Point
; Hellpod; 2 one with each of the three Infiltration Hellpods; 0 off. Read at game start.
pods_resupply = 1
;
; Not included in this mod: patrols keeping to their
; outposts (that is the separate Lost Contact mod), sabotage objectives and captured SEAF sites (later).
