; Commando Plus 0.5.6 (TEST BUILD). Commando missions made a little more forgiving. Host or solo: a
; joined player's game changes nothing. Commando is told by the Super Destroyer call-in (Call In Destroyer) on your
; stratagem record, read 8 s after the mission starts.
;
; 1 = the mission timer is paused in Commando; 0 = it runs as usual.
no_timer = 1
;
; Free Resupply calls granted outside your loadout at the drop-in (0 to 2).
resupply_calls = 1
;
; Extra uses of the Super Destroyer call-in (0 to 3; Commando gives 1).
extra_calls = 1
;
; 1 = the options above apply to every mission, not only Commando; 0 = Commando only.
every_mission = 0
;
; More stims and grenades at points of interest: NOT WORKING YET (1 = off). The loot roll it changes fills the POI
; crates (support weapons, credits), not stims or grenades; where those come from needs a probe first.
poi_extra = 1
;
; Outpost caches: every enemy base you clear (its bug holes, fabricators or Illuminate spawners within base_radius m of
; each other, all closed or destroyed) pays out. 0 = off.
outpost_caches = 1
; The cash-in: 1 = each base banks ammo boxes, called in by two stratagems granted on your list: the Outpost Cache
; (D U D U D U R), a pod of 8 boxes, one use for every 8 banked, and the Small Outpost Cache (D U D U D U L), one pod of
; the boxes past the last 8. In Commando they can be thrown only while the Super Destroyer is overhead, so calling it in
; is cashing in. 0 = each base gives free calls of the reward ammo rack instead.
cash_in = 1
; Boxes for a small base, and for a large one (3 or more spawners, or a big nest / bulk or gunship fabricator / bunker).
cache_boxes_small = 4
cache_boxes_large = 8
; cash_in 0 only: calls for a small base and a large one, and what they are (0 the reward ammo rack, 1 Resupply uses).
cache_calls_small = 1
cache_calls_large = 2
cache_reward = 0
; How close spawners stand to count as one base (m, 10 to 200).
base_radius = 40
;
; 1 = a Resupply thrown in Commando lands at the Reinforcement Pods (the nearest that have had none, one each), not where
; it was thrown; once every pod site has had one, Resupplies land where thrown again. 0 = off.
resupply_to_pods = 0
;
; TEST: how long the Super Destroyer stays overhead in Commando, in seconds (the game's is 60; 61 to 600). 0 = the game's.
destroyer_window = 0
;
; Not included in this mod: patrols keeping to their
; outposts (that is the separate Lost Contact mod), sabotage objectives and captured SEAF sites (later).
