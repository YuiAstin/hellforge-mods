; Ascalon 0.4.4. Keys: a letter, digit, F1-F24, Mouse3, Mouse4 or Mouse5, with Shift+, Ctrl+ or Alt+ in front for a
; combo (Shift+Q). (Her skills are not in this build: the keys are kept for them.)
key_spare = Z
key_endowment = X
key_descent = C
; Ambusher (always on): every hit of hers also strikes every enemy within area_radius m of her that she has a
; clear line to, for area_mult times that hit's damage: at most area_max enemies, one volley every area_every s.
; area_round: the vanilla projectile the strikes fly as (7: a rifle round).
area_radius = 15
area_mult = 1
area_max = 12
area_every = 0.25
area_round = 7
; Pursuit (by itself): pursuit_charges charges, one back every pursuit_every s. A hit with a charge deals
; pursuit_mult times its damage, lands twice on everyone in range and slows them (pursuit_slow: 100 a full dose).
pursuit_charges = 3
pursuit_every = 7
pursuit_mult = 2.1
pursuit_slow = 100
; Parry (parry 1): with a dedicated melee weapon in hand (a CQC weapon), right-click within parry_window s before a
; hit lands: the hit does nothing, nothing hits her for parry_invuln s, she is set parry_behind m behind the
; attacker, it is stunned (parry_stun), and her counter strikes everyone in range for parry_damage.
parry = 1
parry_window = 0.3
parry_invuln = 1
parry_damage = 300
parry_behind = 2.2
parry_stun = 300
; Dash (dash 1): while she is moving, the melee key (melee_key_code: its Windows key code; 70 is F), or a left
; click with a dedicated melee weapon in hand, dashes her dash_distance m the way she moves and strikes every
; enemy within dash_width m of the path for dash_damage. Once every dash_cooldown s.
dash = 1
melee_key_code = 70
dash_distance = 6
dash_cooldown = 1.2
dash_damage = 150
dash_width = 2
; Endowment (key_endowment): for e_seconds her hits deal e_mult times their damage, every enemy within e_radius m
; of her is slowed (e_slow a dose, twice a second), and an enemy that dies near her leaves a Mortal Interrogation
; stack on every enemy within e_spread m of it. Then e_cooldown s before it can be cast again.
e_seconds = 35
e_cooldown = 20
e_mult = 2.3
e_radius = 15
e_slow = 60
e_spread = 5
; Descent (key_descent): she steps out of hiding: for d_seconds no hit on her lands and her hits deal d_mult
; times their damage; each enemy that dies near her adds d_per_kill s (never more than d_cap s left). She is
; seen and drawn while it lasts, and hidden again d_grace s after. Then d_cooldown s.
d_seconds = 5
d_cooldown = 45
d_mult = 1.5
d_per_kill = 2
d_cap = 15
d_grace = 2
; Mortal Interrogation: each hit or strike of hers puts a stack on its target (mi_stacks at most) for mi_seconds
; from the last one. A marked enemy takes mi_damage times the marking hit's damage a second for each stack, and
; a dose of the slow (mi_slow a stack; 100 a full dose).
mi_stacks = 3
mi_seconds = 25
mi_damage = 0.1
mi_slow = 18
; mi_status: the game status that does the mark's damage (2: bleed), a dose of mi_status_buildup a stack every
; second (100 a full dose). 0: no status; the mark's damage is mi_damage, above, dealt by the mod itself (as it
; is when the game refuses the status).
mi_status = 2
mi_status_buildup = 100
; numbers 1: the HUD shows a number over every hit, strike and tick of hers.
numbers = 1
; Hidden: while she makes no noise, enemies see her visual_cut percent less far, and whoever within forget_range m
; still targets her forgets her every forget_every s.
visual_cut = 95
forget_every = 0.5
forget_range = 150
; What reveals her is the game's own hearing and sight: an enemy that senses her right now (it heard her gun, or
; she is right in front of it) keeps her; she counts as revealed while any does, and reveal_hold s after.
reveal_hold = 1.5
; Hearing: an enemy that picks her up without seeing her within noise_window s of her last shot heard it, and
; keeps her for heard_hold s (the game decides who hears which gun, and how far).
noise_window = 1
heard_hold = 5
; gear_rule 1: with a backpack on or a support weapon in her hands she is not hidden at all (she still looks it).
gear_rule = 1
; Ambusher: while hidden, this share of the hits that still land on her miss (0.5: half).
dodge = 0.5
; cloak_visual 1: her body is not drawn while hidden (needs Bingus Shared Loader and HD2Runtime); hide_gear 1: nor
; are her weapons and backpack.
cloak_visual = 1
hide_gear = 1
; Her body: hp_mult times a Helldiver's health, stamina_mult times her sprint.
hp_mult = 1
stamina_mult = 1.2
hellbomb_on_exhaustion = 0
