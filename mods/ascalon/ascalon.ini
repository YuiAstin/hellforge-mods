; Ascalon 0.2.0. Keys: a letter, digit, F1-F24, Mouse3, Mouse4 or Mouse5, with Shift+, Ctrl+ or Alt+ in front for a
; combo (Shift+Q). (Her skills are not in this build: the keys are kept for them.)
key_spare = Z
key_endowment = X
key_descent = C
; Ambusher (always on): every hit of hers also strikes every enemy within area_radius m of her that she has a
; clear line to, for area_mult times that hit's damage: at most area_max enemies, one volley every area_every s.
; area_round: the vanilla projectile the strikes fly as (7: a rifle round).
area_radius = 15
area_mult = 1
area_max = 12
area_every = 0.25
area_round = 7
; Pursuit (by itself): pursuit_charges charges, one back every pursuit_every s. A hit with a charge deals
; pursuit_mult times its damage, lands twice on everyone in range and slows them (pursuit_slow: 100 a full dose).
pursuit_charges = 3
pursuit_every = 7
pursuit_mult = 2.1
pursuit_slow = 100
; Hidden: while she makes no noise, enemies see her visual_cut percent less far, and whoever within forget_range m
; still targets her forgets her every forget_every s.
visual_cut = 95
forget_every = 0.5
forget_range = 150
; What reveals her is the game's own hearing and sight: an enemy that senses her right now (it heard her gun, or
; she is right in front of it) keeps her; she counts as revealed while any does, and reveal_hold s after.
reveal_hold = 1.5
; Hearing: an enemy that picks her up without seeing her within noise_window s of her last shot heard it, and
; keeps her for heard_hold s (the game decides who hears which gun, and how far).
noise_window = 1
heard_hold = 5
; gear_rule 1: with a backpack on or a support weapon in her hands she is not hidden at all (she still looks it).
gear_rule = 1
; Ambusher: while hidden, this share of the hits that still land on her miss (0.5: half).
dodge = 0.5
; cloak_visual 1: her body is not drawn while hidden (needs Bingus Shared Loader and HD2Runtime); hide_gear 1: nor
; are her weapons and backpack.
cloak_visual = 1
hide_gear = 1
; Her body: hp_mult times a Helldiver's health, stamina_mult times her sprint.
hp_mult = 1
stamina_mult = 1.2
hellbomb_on_exhaustion = 0
