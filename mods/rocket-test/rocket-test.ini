; Rocket Sentry Test settings, read at game start. Edit them with the game closed.
; 0: only log; 1: the Rocket Sentry fires a copy of its rocket carrying the P-33's warhead (a sentry called in after the
; game loads). The rocket keeps its look and its straight 100 m/s flight.
apply = 1
; The warhead: the direct-hit damage row (95: the P-33's, 1000 damage, AP 5; the rocket's own is 232, 525) and the impact
; explosion row (154: the P-33's, 300 damage, radius 2 / 4 / 12 m; the rocket's own is 315, 150, 1 / 4 / 6 m).
warhead_damage = 95
warhead_explosion = 154
; The warhead rocket's speed, m/s (the rocket's own: 100). Slower gives HellForge's homing time to find its target
; (its enemy scan only runs while a homing rocket is in the air, so it finds one 0.1-1 s after launch).
rocket_speed = 60
; Hunter-Killer: 1 a homing rule on the warhead rocket; 0 off. homing_sources 1: only the Rocket Sentry's shots (the test:
; does a sentry's shot count as yours?), 0: any of yours (the Last Stand's rockets too). Turn rate (degrees a second),
; the cone it looks for targets in (degrees each side), its reach (m) and the metres flown before it steers.
homing = 1
homing_sources = 1
homing_turn_rate = 540
homing_cone = 30
homing_range = 120
homing_arm_distance = 3
; Metres above the target's feet it aims at, and 1: it keeps the first target it picks (0: picks again every 0.1 s,
; the enemy most in its path, which can swing it onto another mid-flight).
homing_aim_height = 0.6
homing_keep_target = 1
; Last Stand: 1 when your Rocket Sentry is destroyed or its time runs out it fires last_stand_rockets warhead rockets in a
; ring around itself (angled down by last_stand_pitch, landing about 15-20 m out), then a last_stand_blast explosion
; (row 154: the P-33's) where it stood; 0 off.
last_stand = 1
last_stand_rockets = 8
last_stand_pitch = -0.12
last_stand_blast = 154
