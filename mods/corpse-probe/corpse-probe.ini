; Corpse Probe 0.1.0 (a probe, not a release). key: a letter, digit, F1-F24, Mouse3-5, with Shift+, Ctrl+ or Alt+.
; The key turns the freeze on and off: while on, each enemy that dies has its body's physics switched off delay s
; after its death. on: 1 starts each mission with it on. restore: 1 gives the frozen bodies their physics back
; when it is turned off. report: the log's frame-rate line every that many s. batch: the bodies are looked up at
; most once every that many s (each look-up walks every unit in the world).
key = F6
on = 0
delay = 3
restore = 1
report = 5
batch = 2
